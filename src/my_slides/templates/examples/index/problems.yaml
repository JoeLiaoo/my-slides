# Example index — problems.yaml
#
# Used by `prepare slides` to look up the 1–2 most relevant examples for the
# current Spec. The handoff surfaces the path + a one-line summary only.
#
# Each entry lists:
#   id          — short id of the example
#   category    — top-level directory under examples/
#   path        — relative path from the skill root
#   title       — short title
#   summary     — one-line summary shown in the handoff
#   purpose     — what the example is for
#   inputs      — required inputs (data shape)
#   bounds      — limitations / scope
#   density     — text density (low / medium / high)
#   layout      — recommended layout
#   relation    — relation type from Spec 布局意图
#   signals     — keywords that trigger this example

- id: investment-summary-cover-kpis
  category: investment-summary
  path: examples/investment-summary/01-cover-kpis
  title: 投资摘要 KPI 封面
  summary: 一句话跟投 + 5 张 KPI 卡片网格；IC 30 秒决策。
  purpose: 一句话决策判断
  inputs: 3–5 个 KPI（估值、增速、回本、集中度、风险）
  bounds: 单一情景
  density: 极低
  layout: 单段标题 + KPI 卡片网格
  relation: 对比 / 风险
  signals:
    - 跟投
    - 一句话
    - KPI
    - 估值
    - 阈值
    - verdict

- id: market-trend-pivot
  category: market-trend
  path: examples/market-trend/01-pivot-share-shift
  title: 行业拐点 + 占比迁移
  summary: 100% 堆叠条 + 拐点说明块；表达「哪一年 + 谁抢谁」。
  purpose: 行业拐点 + 占比迁移
  inputs: 5–8 年序列 + 4–6 个类别
  bounds: 同口径、同范围
  density: 中
  layout: 左侧堆叠条 + 右侧拐点说明
  relation: 时间序列 + 结构构成
  signals:
    - 拐点
    - 占比
    - 份额
    - 迁移
    - industry
    - stacked

