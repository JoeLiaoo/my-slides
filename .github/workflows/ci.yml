name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tests:
    name: Full regression (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check PR version and changelog
        if: github.event_name == 'pull_request'
        env:
          MY_SLIDES_ALLOW_MAJOR_VERSION: ${{ contains(github.event.pull_request.labels.*.name, 'version:major') }}
        run: python scripts/check_pr_version.py --base-ref origin/main
      - name: Install my-slides
        run: python -m pip install -e .
      - name: Check skill template mirrors
        run: python scripts/sync-skill-templates.py --check
      # Design+Slides lives in a private repo, so its engine integration tests skip here;
      # run ./scripts/run-full-tests.sh locally with MY_SLIDES_DESIGN_ROOT for that gate.
      - name: Run regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  release-tag:
    name: Tag release on main
    needs: full-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Recheck that the merge advanced the version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/check_pr_version.py --mode check-main --before "$BEFORE_SHA"
      - name: Create and push missing version tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/check_pr_version.py --mode tag --push
