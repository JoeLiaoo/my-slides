name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tests:
    name: Full regression (Python 3.11, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check PR version and changelog
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          MY_SLIDES_ALLOW_MAJOR_VERSION: ${{ contains(github.event.pull_request.labels.*.name, 'version:major') }}
        run: python scripts/check_pr_version.py --base-ref "origin/${BASE_BRANCH}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install Python and browser system dependencies
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install-deps chromium
      - name: Run full regression
        run: ./scripts/run-full-tests.sh
