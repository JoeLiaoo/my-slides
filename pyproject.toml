[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-slides"
version = "0.9.1"
description = "Thin agent workspace for research articles and multiple presentations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
my-slides = "my_slides.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Skill text ships as templates/my-slides-workflow.md (single source copied from skills/).
# On-demand references and the example library live under templates/references/
# and templates/examples/ and must stay in sync with skills/my-slides-workflow/.
my_slides = [
  "templates/*.md",
  "templates/references/*.md",
  "templates/examples/**/*.md",
  "templates/examples/**/*.json",
  "templates/examples/**/*.yaml",
  "templates/examples/**/*.html",
]
