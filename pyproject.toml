[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-slides"
version = "0.2.10"
description = "Local agent workflow for investment project wikis, reports, and HTML slides"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.52,<2"]

[project.scripts]
my-slides = "my_slides.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Skill text ships as templates/my-slides-workflow.md (single source copied from skills/).
my_slides = [
  "templates/*.md",
  "renderer/*.mjs",
  "renderer/*.json",
  "slides_theme/*.css",
  "slides_theme/*.md",
  "slides_theme/*.json",
  "slides_theme/upstream/*",
]
